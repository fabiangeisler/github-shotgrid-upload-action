name: 'Upload to ShotGrid'
author: 'Fabian Geisler'
description: 'Upload an artifact to a ShotGrid entity field.'

branding:
  icon: upload-cloud
  color: blue

inputs:
  mode:
    description: 'The mode of operation. "update existing" uploads a file to an existing entity.
                  "create new" creates a new entity and uploads a file to it.'
    required: false
    default: update existing
  upload_file:
    description: 'Path to the file you want to upload. Glob patterns are supported, but
                  only the first found file will be uploaded.'
    required: true
  delete_file_after_upload:
    description: 'Whether the uploaded file should be removed from disk after upload.'
    required: false
    default: false
  shotgrid_base_url:
    description: 'The URL of the ShotGrid site you use as a cpenv repo. Store as a github secret.'
    required: true
  shotgrid_script_name:
    description: 'Name of ShotGrid api script. Store as a github secret.'
    required: true
  shotgrid_api_key:
    description: 'ShotGrid api script key. Store as github secret.'
    required: true
  entity_type:
    description: 'Name of ShotGrid entity like, "PipelineConfiguration".'
    required: true
  entity_id:
    description: 'ID of ShotGrid entity. Required when mode is "update existing".'
    required: false
  field_name:
    description: 'The field of ShotGrid entity to upload to. (eg."uploaded_config")'
    required: true
  fields:
    description: 'YAML formatted field values to set on the new entity. Only used when mode
                  is "create new". Example: "code: My Bundle\nversion: v1.0.0"'
    required: false

runs:
  using: 'composite'
  steps:
    - name: "Install dependencies"
      working-directory: ${{ github.action_path }}
      # Note: The "setup-python" GitHub action can be tricky to setup on self hosted runners.
      # We skip this action here and setup our dependencies manually.
      run: | 
        python -m venv venv
        source venv/bin/activate
        python -m pip install -r requirements.txt 
        deactivate
      shell: bash
    - name: Upload file to ShotGrid
      working-directory: ${{ github.action_path }}
      run: |
        source venv/bin/activate

        ARGS=(-type "${{ inputs.entity_type }}" -field "${{ inputs.field_name }}" -i "${{ inputs.upload_file }}")

        if [ "${{ inputs.mode }}" = "create new" ]; then
          ARGS+=(--mode "create new")
          if [ -n "$INPUT_FIELDS" ]; then
            ARGS+=(--fields "$INPUT_FIELDS")
          fi
        else
          ARGS+=(-id "${{ inputs.entity_id }}")
        fi

        if [ "${{ inputs.delete_file_after_upload }}" = "true" ]; then
          ARGS+=(--delete_file_after_upload)
        fi

        python "${{ github.action_path }}/sg_uploader.py" "${ARGS[@]}"
        deactivate
      shell: bash
      env:
        SHOTGRID_SITE: "${{ inputs.shotgrid_base_url }}"
        SHOTGRID_SCRIPT_USER: "${{ inputs.shotgrid_script_name }}"
        SHOTGRID_APPLICATION_KEY: "${{ inputs.shotgrid_api_key }}"
        INPUT_FIELDS: "${{ inputs.fields }}"
    - name: Cleanup resources
      working-directory: ${{ github.action_path }}
      if: always()
      run: |
        rm -rf ./venv
      shell: bash
